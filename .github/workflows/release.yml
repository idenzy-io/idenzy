name: Release

# Publishes the SDK packages to npm (docs/guide/sdk.md, "Releasing").
#
# On every push to main, the Changesets action does one of two things: with changesets
# pending, it opens or updates a "Version Packages" pull request; with none, it publishes any
# package whose version is not on npm yet, which is what merging that pull request leads to.
#
# Off until the repository variable PUBLISH is "true", so a fork, or this repository before
# its npm token exists, spends no minutes failing here. NPM_PROVENANCE is the second switch:
# npm only attests packages built from a public repository, so it turns on when this one is.
#
# The native packages on npm load the native SDKs at their own version, so on a run that
# publishes, release-native.yml puts those on Maven Central and CocoaPods first, and npm waits
# for it (docs/guide/native.md, "Releasing").

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  # npm's trusted publishing, and provenance once the repository is public.
  id-token: write

env:
  TURBO_TELEMETRY_DISABLED: 1
  DO_NOT_TRACK: 1

jobs:
  # Whether this run publishes native packages whose native SDKs are not released yet. Only
  # then does the native release run, and npm waits for it.
  plan:
    name: plan
    if: vars.PUBLISH == 'true'
    runs-on: ubuntu-latest
    outputs:
      native: ${{ steps.plan.outputs.native }}
    steps:
      - uses: actions/checkout@v4
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISH_NATIVE: ${{ vars.PUBLISH_NATIVE }}
        run: |
          pending=$(find .changeset -name '*.md' ! -name README.md | wc -l)
          manifest=packages/sdk/native/js/package.json
          version=$(node -p "require('./$manifest').version")
          private=$(node -p "Boolean(require('./$manifest').private)")
          native=false
          if [ "$pending" -eq 0 ] && [ "$private" = "false" ] && ! gh release view "v$version" >/dev/null 2>&1; then
            if [ "$PUBLISH_NATIVE" != "true" ]; then
              echo "::error::The native packages would publish $version to npm before the native SDKs they load. Set PUBLISH_NATIVE."
              exit 1
            fi
            native=true
          fi
          echo "native=$native" >> "$GITHUB_OUTPUT"

  native:
    name: native SDKs
    needs: plan
    if: needs.plan.outputs.native == 'true'
    uses: ./.github/workflows/release-native.yml
    secrets: inherit

  release:
    name: version or publish
    needs: [plan, native]
    # After the native release when there was one, and never after one that failed.
    if: >-
      always() && needs.plan.result == 'success'
      && (needs.native.result == 'success' || needs.native.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install
        run: pnpm install --frozen-lockfile

      # The packages are checked here rather than trusted to CI's last run on this commit:
      # a release is the one moment a red build reaches somebody else's application.
      - name: Typecheck, test and build the published packages
        run: >-
          pnpm turbo run typecheck test build
          --filter=./packages/protocol --filter=./packages/core
          --filter=./packages/sdk/** --filter=./tools/cli

      - uses: changesets/action@v1
        with:
          # The native tree states the same version in Gradle, the podspecs, the pubspec and
          # Cargo; the generator writes it there from the bumped packages (docs/guide/native.md).
          version: >-
            sh -c "pnpm changeset version
            && pnpm turbo run build --filter=@idenzy/native-codegen
            && pnpm native:generate"
          publish: pnpm release
          title: "chore(sdk): version packages"
          commit: "chore(sdk): version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The first publish of each package needs a token; trusted publishing takes over
          # once it is configured for every package on npmjs.com, and the secret can then go.
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: ${{ vars.NPM_PROVENANCE == 'true' }}
