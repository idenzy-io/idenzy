name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Turbo needs no network for correctness; remote cache is added when the team is.
  TURBO_TELEMETRY_DISABLED: 1
  DO_NOT_TRACK: 1

jobs:
  verify:
    name: typecheck, lint, unit, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # --frozen-lockfile is the supply-chain control, not a convenience: it fails if
      # the lockfile and manifests disagree, which is how a dependency gets swapped in
      # without review (PROJECT.md 7.6).
      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Verify lifecycle scripts are disabled
        run: |
          test "$(pnpm config get ignoreScripts)" = "true" \
            || { echo "ignoreScripts is not in effect; see PROJECT.md 7.6"; exit 1; }

      - name: Typecheck
        run: pnpm turbo run typecheck

      - name: Lint and format
        run: pnpm exec biome ci .

      - name: Unit tests
        run: pnpm turbo run test

      - name: Build
        run: pnpm turbo run build

      # Section 4.13.2: the data map and RoPA are generated from the schema. If a schema
      # change did not regenerate them they are stale, and a stale compliance document is
      # worse for an audit than none. Same contract as a lockfile.
      - name: Compliance artifacts are current
        run: pnpm compliance:check

      # The starter templates in examples/ are what `idenzy init` writes, generated from the
      # same templates. A change to a template that did not regenerate them leaves the copy a
      # customer reads first disagreeing with the one the CLI would write.
      - name: Starter templates are current
        run: pnpm examples:check

      # The native core's enums and wire constants are generated from @idenzy/protocol, and the
      # SDK's version is written into every native file that states it. A protocol change that
      # did not regenerate them reaches every mobile SDK as a silent divergence (ADR-0022), and a
      # version bump that reached npm and not Maven ships a module asking for an SDK it is not.
      - name: Native protocol enums and versions are current
        run: pnpm native:check

  native-core:
    name: native core (Rust)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: packages/sdk/native
    steps:
      - uses: actions/checkout@v4
      # rustup reads rust-toolchain.toml, so the toolchain, its components and the targets are
      # the pinned ones without a setup action. --locked is the Cargo half of PROJECT.md 7.6.
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

  native-android:
    name: native SDK (Android)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: packages/sdk/native
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      # The bindings and the host library only: the unit tests load the real core through JNA.
      - run: scripts/build-android.sh --dev
      # The Lynx module is built here too and has its own test of the values it hands Lynx.
      - run: ./gradlew :idenzy:testDebugUnitTest :idenzy-lynx:testDebugUnitTest --console=plain
        working-directory: packages/sdk/native/android

  native-apple:
    name: native SDK (Apple)
    runs-on: macos-15
    timeout-minutes: 20
    defaults:
      run:
        working-directory: packages/sdk/native
    steps:
      - uses: actions/checkout@v4
      - run: scripts/build-apple.sh --dev
      - run: swift test
        working-directory: packages/sdk/native/apple

  native-flutter:
    name: native SDK (Flutter)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: packages/sdk/native/flutter/idenzy_flutter
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.4
          channel: stable
      # The Dart layer against a stand-in channel. The native halves are compiled and run on a
      # device by the example's integration test, which needs a simulator or an emulator.
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  integration:
    name: integration (containers)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run build

      # Includes the RLS negative tests and the audit append-only tests. These are the
      # ones that must never be allowed to become optional (PROJECT.md 7.4).
      - name: Integration tests
        run: pnpm turbo run test:integration

  supply-chain:
    name: dependency policy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Known advisories
        run: pnpm audit --audit-level moderate

      # CycloneDX SBOM per release, kept as compliance evidence (PROJECT.md 4.13.9).
      - name: Generate SBOM
        run: pnpm dlx @cyclonedx/cyclonedx-npm --output-file sbom.json --omit dev
        continue-on-error: true

      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.json
          if-no-files-found: warn
