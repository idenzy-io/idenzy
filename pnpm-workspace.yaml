packages:
  - apps/*
  - packages/*
  - packages/sdk/client/*
  - packages/sdk/server/*
  - tools/*

# Supply-chain and reproducibility settings (PROJECT.md 7.6).
#
# These live here, not in .npmrc. pnpm 11 does not read project .npmrc for them,
# so writing `ignore-scripts=true` there looks correct and silently does nothing:
# exactly how a supply-chain control ends up documented but not in effect.
# Verify with `pnpm config list`.
ignoreScripts: true
nodeLinker: isolated
strictPeerDependencies: true
autoInstallPeers: false
resolutionMode: highest
preferFrozenLockfile: true
saveExact: true
engineStrict: true

# Anything that genuinely needs a native build is allowlisted here and requires
# reviewer sign-off to add (PROJECT.md 7.6).
onlyBuiltDependencies:
  - argon2

# Advisories with no fix published, or none reachable from how we run the package, each with
# the reason. `pnpm audit` in CI fails on anything not on this list.
auditConfig:
  ignoreGhsas:
    # esbuild <=0.24.2's dev server answers any origin. drizzle-kit (latest, 0.31.x) pins it
    # through @esbuild-kit/core-utils for loading the config file; no server is ever started.
    - GHSA-67mh-4wv8-2f99
    # node-forge <=1.4.0, no fixed release yet. listhen uses it to mint the self-signed
    # certificate of `nuxt dev --https`; nothing verifies a signature with it.
    - GHSA-86w9-cpqp-85rv
    # braces <=3.0.3, no fixed release yet. micromatch expands build-time glob patterns from
    # our own config in nitropack; no request reaches it.
    - GHSA-vfj7-8cjw-p6xm
    # simple-git <4.0.1 and its argv parser: unsafe handling of caller-supplied arguments and
    # environment. Only @nuxt/devtools uses it, under `nuxt dev`, with fixed arguments
    # (branch(), revparse(["--short", "HEAD"]), status()) on the developer's own checkout.
    # 4.x removes the default export devtools imports, so it cannot be overridden either.
    - GHSA-x6jw-m9v5-85vh
    - GHSA-g4wm-2vf7-vfgr
    - GHSA-858h-whjf-mvg5
    - GHSA-v5rq-49vh-5v5c

# Single source of truth for shared dependency versions. Packages reference these
# as "catalog:" so a bump happens in one place.
catalog:
  # Toolchain. TypeScript is pinned to 6.0.x deliberately: TS 7 is released, but
  # @nestjs/cli 12 depends on typescript ~6.0.2 and Nest DI needs emitDecoratorMetadata.
  typescript: 6.0.3
  '@types/node': 26.4.1
  turbo: 2.10.12
  vitest: 4.1.11
  '@vitest/coverage-v8': 4.1.11

  # Runtime framework
  '@nestjs/common': 12.1.2
  '@nestjs/core': 12.1.2
  '@nestjs/platform-fastify': 12.1.2
  '@nestjs/testing': 12.1.2
  '@nestjs/terminus': 12.0.0
  fastify: 5.12.5
  reflect-metadata: 0.2.2
  rxjs: 7.8.2

  # Cloud. Application Default Credentials only: the full @google-cloud SDKs drag gax, grpc-js
  # and protobufjs onto the path that holds every credential, and Â§7.6 prefers one audited
  # library over three convenient ones. KMS, Secret Manager and Storage are reached over REST.
  google-auth-library: 11.0.2

  # Data
  drizzle-orm: 0.45.2
  drizzle-kit: 0.31.10
  pg: 8.23.0
  '@types/pg': 8.15.6
  iovalkey: 0.4.0

  # Crypto and auth primitives
  jose: 6.2.10
  argon2: 0.45.1
  '@simplewebauthn/server': 14.0.0
  '@google-cloud/kms': 6.0.0

  # Payments. The one vendor SDK we take rather than calling the REST API ourselves, unlike
  # SES and Cloud Tasks: Stripe's surface here is customers, checkout sessions, payment
  # methods and off-session intents, and its webhook signature check is the part worth not
  # hand-rolling — the tolerance window and the constant-time compare are exactly where a
  # careful implementation of ours would be a liability rather than an asset.
  stripe: 22.6.2

  # Front end
  nuxt: 4.5.2
  '@nuxt/kit': 4.5.2
  '@nuxt/schema': 4.5.2
  vue: 3.5.42
  vue-tsc: 3.3.11

  # Panel UI. Vuetify 4 is only supported by the 1.0 line of the Nuxt module, which is
  # still a release candidate; the stable 0.18 line pins vuetify to ^3.4. Exact pins
  # everywhere because saveExact is on and an RC may break between patches.
  vuetify: 4.2.0
  vuetify-nuxt-module: 1.0.0-rc.5
  tailwindcss: 4.3.3
  '@tailwindcss/vite': 4.3.3
  '@iconify-json/material-symbols': 1.2.91
  '@iconify-json/logos': 1.2.14
  '@iconify-json/lucide': 1.2.130
  '@iconify-json/carbon': 1.2.26
  '@iconify-json/circle-flags': 1.2.11
  '@iconify-json/simple-icons': 1.2.95
  '@iconify-json/hugeicons': 1.2.34
  dayjs: 1.11.23
  '@fontsource-variable/dm-sans': 5.3.0
  '@fontsource/dm-mono': 5.3.0
  '@nuxt/icon': 2.5.1
  '@vueuse/core': 14.4.0
  '@vueuse/nuxt': 14.4.0
  echarts: 6.1.0
  vue-echarts: 8.3.0
  nuxt-echarts: 1.0.1
  # nuxt-shiki generates a virtual module that imports grammars and themes straight from
  # `shiki`, so the app resolves it itself and the version has to be pinned beside the
  # module's own rather than left to whatever the module happens to hoist.
  nuxt-shiki: 0.3.2
  shiki: 3.23.0
  pinia: 4.0.3
  '@pinia/nuxt': 1.0.2
  # CodeMirror 6, the panel's editable code surface. Individual packages rather than the
  # `codemirror` meta package: that one pulls `basicSetup`, which is every extension it
  # ships, and this panel wants six of them. Monaco was the other candidate and loses on
  # the two things that decide it here: it loads its language services from separate
  # worker URLs, which a statically generated SPA with no third-party origin
  # (PROJECT.md 10.3) has nowhere to serve from, and it is unusable on a touch screen,
  # which the email template workspace is specified for.
  '@codemirror/state': 6.7.4
  '@codemirror/view': 6.43.11
  '@codemirror/commands': 6.11.0
  '@codemirror/language': 6.12.4
  '@codemirror/autocomplete': 6.20.3
  '@codemirror/lang-html': 6.4.12
  '@codemirror/lint': 6.9.7
  '@lezer/highlight': 1.2.3

  # Client SDK frameworks. Peer-dependency ranges stay wide in the packages
  # themselves; these versions are what we develop and test against.
  react: 19.2.8
  react-dom: 19.2.8
  '@types/react': 19.2.18
  next: 16.3.8
  svelte: 5.57.0
  '@angular/core': 22.1.5
  solid-js: 1.9.16

  # Validation and observability
  zod: 4.5.4
  pino: 10.3.1
  pino-pretty: 13.1.4

  # Testing
  testcontainers: 12.1.0
  '@testcontainers/postgresql': 12.1.0
  '@testing-library/dom': 10.4.1
  '@testing-library/react': 16.3.3
  '@vue/test-utils': 2.5.0
  jsdom: 30.0.1

# What the published SDK packages declare, as ranges rather than the pins above.
#
# A library that pins its dependencies exactly gives every customer a second copy of zod or
# jose the moment their own version differs by a patch, and those copies do not dedupe. The
# floor is the version this workspace builds and tests against, so the two lists move
# together: bump a pin above and its floor here in the same change.
catalogs:
  sdk:
    zod: ^4.5.4
    jose: ^6.2.10
    '@nuxt/kit': ^4.5.2
