[package]
name = "idenzy-native"
description = "The protocol and session core every native Idenzy SDK is built on."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "idenzy_native"
# `staticlib` for the iOS XCFramework, `cdylib` for Android and for bindgen's library mode, `lib`
# for the tests and for a Rust host (Tauri, Godot) that links the crate directly.
crate-type = ["lib", "staticlib", "cdylib"]

[dependencies]
uniffi.workspace = true
async-trait.workspace = true
async-lock.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
getrandom.workspace = true
thiserror.workspace = true

[dev-dependencies]
futures.workspace = true
