[workspace]
resolver = "3"
members = ["core", "uniffi-bindgen"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
publish = false

# One version of each, pinned exactly like the pnpm catalog (saveExact). The lockfile carries the
# checksums and CI builds with --locked (PROJECT.md 7.6).
[workspace.dependencies]
uniffi = "=0.32.2"
async-trait = "=0.1.92"
async-lock = "=3.4.2"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sha2 = "=0.11.0"
getrandom = "=0.4.3"
thiserror = "=2.0.21"
futures = { version = "=0.3.34", default-features = false, features = ["std", "executor", "async-await"] }

[profile.release]
# Size over speed. Nothing in the core is hot: it waits on the network for a living, and every
# kilobyte here is paid by every app that ships it, once per architecture. Panics stay unwinding:
# UniFFI turns one into an exception at the boundary, and `abort` would turn it into a crash.
opt-level = "z"
lto = true
codegen-units = 1
strip = "symbols"
