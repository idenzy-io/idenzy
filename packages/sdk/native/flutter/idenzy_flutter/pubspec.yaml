name: idenzy_flutter
description: "Idenzy for Flutter: sign-in, sessions and MFA over the native iOS and Android SDKs. Headless: every screen is yours."
version: 0.1.0
repository: https://github.com/idenzy-io/idenzy/tree/main/packages/sdk/native/flutter/idenzy_flutter
publish_to: none

environment:
  sdk: ^3.6.0
  # Plugins resolved through Swift Package Manager, which is how the iOS half reaches the Swift SDK.
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: io.idenzy.flutter
        pluginClass: IdenzyPlugin
      ios:
        pluginClass: IdenzyPlugin
