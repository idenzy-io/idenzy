packages:
  - apps/*
  - packages/*
  - packages/sdk/*
  - tools/*

# Single source of truth for shared dependency versions (PROJECT.md 7.6).
# Packages reference these as "catalog:" so a bump happens in one place.
catalog:
  # Toolchain. TypeScript is pinned to 6.0.x deliberately: TS 7 is released, but
  # @nestjs/cli 12 depends on typescript ~6.0.2 and Nest DI needs emitDecoratorMetadata.
  typescript: 6.0.3
  '@types/node': 26.0.4
  turbo: 2.10.12
  vitest: 4.1.11
  '@vitest/coverage-v8': 4.1.11

  # Runtime framework
  '@nestjs/common': 12.0.1
  '@nestjs/core': 12.0.1
  '@nestjs/platform-fastify': 12.0.1
  '@nestjs/terminus': 12.0.0
  fastify: 5.12.1
  reflect-metadata: 0.2.2
  rxjs: 7.8.2

  # Data
  drizzle-orm: 0.45.2
  drizzle-kit: 0.31.10
  pg: 8.23.0
  '@types/pg': 8.15.6
  iovalkey: 0.4.0

  # Crypto and auth primitives
  jose: 6.2.10
  argon2: 0.45.1
  '@simplewebauthn/server': 14.0.0
  '@google-cloud/kms': 6.0.0

  # Validation and observability
  zod: 4.5.4
  pino: 10.3.1
  pino-pretty: 13.1.4

  # Testing
  testcontainers: 12.2.0
  '@testcontainers/postgresql': 12.2.0

onlyBuiltDependencies:
  # .npmrc sets ignore-scripts=true. Anything that genuinely needs a native build is
  # listed here and requires reviewer sign-off to add (PROJECT.md 7.6).
  - argon2
